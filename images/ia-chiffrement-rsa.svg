<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d">
  <title id="t">L'IA peut-elle casser un chiffrement RSA ?</title>
  <desc id="d">Illustration : un cadenas RSA au centre, une clé publique et une clé privée, un circuit d'IA bloqué et un atome symbolisant l'informatique quantique.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#1a3a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fond -->
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect width="800" height="420" fill="url(#grid)"/>
  <circle cx="400" cy="200" r="190" fill="url(#glow)"/>

  <!-- Flux de chiffres en arrière-plan -->
  <g font-family="'Source Sans 3', system-ui, sans-serif" font-size="13" fill="#5eead4" fill-opacity="0.18">
    <text x="40" y="60">7³ mod 55 = 13</text>
    <text x="610" y="70">n = p × q</text>
    <text x="60" y="380">13²⁷ mod 55 = 7</text>
    <text x="600" y="385">2048 bits ≈ 617 chiffres</text>
  </g>

  <!-- IA (à gauche) : puce bloquée -->
  <g transform="translate(110 150)">
    <rect x="0" y="0" width="110" height="110" rx="14" fill="#13293f" stroke="#7aa7d9" stroke-width="2.5"/>
    <g stroke="#7aa7d9" stroke-width="2.5" stroke-linecap="round">
      <line x1="25" y1="-14" x2="25" y2="0"/><line x1="55" y1="-14" x2="55" y2="0"/><line x1="85" y1="-14" x2="85" y2="0"/>
      <line x1="25" y1="110" x2="25" y2="124"/><line x1="55" y1="110" x2="55" y2="124"/><line x1="85" y1="110" x2="85" y2="124"/>
      <line x1="-14" y1="30" x2="0" y2="30"/><line x1="-14" y1="80" x2="0" y2="80"/>
    </g>
    <text x="55" y="66" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="34" font-weight="700" fill="#ffffff">IA</text>
  </g>
  <!-- Flèche IA → cadenas, interrompue -->
  <g stroke="#7aa7d9" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M238 205 H300" stroke-dasharray="8 8"/>
  </g>
  <g transform="translate(318 205)" stroke="#f9a8a8" stroke-width="4" stroke-linecap="round">
    <line x1="-9" y1="-9" x2="9" y2="9"/><line x1="9" y1="-9" x2="-9" y2="9"/>
  </g>

  <!-- Cadenas central -->
  <g transform="translate(400 210)">
    <path d="M-42 -20 V-52 a42 42 0 0 1 84 0 V-20" fill="none" stroke="#e8f4fc" stroke-width="13" stroke-linecap="round"/>
    <rect x="-66" y="-24" width="132" height="104" rx="16" fill="#1a5fb4" stroke="#5eead4" stroke-width="3"/>
    <circle cx="0" cy="18" r="12" fill="#0d1b2a"/>
    <rect x="-5" y="22" width="10" height="26" rx="4" fill="#0d1b2a"/>
    <text x="0" y="70" text-anchor="middle" font-family="'Source Sans 3', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="1">RSA-2048</text>
  </g>

  <!-- Clés sous le cadenas -->
  <g font-family="'Source Sans 3', system-ui, sans-serif" font-size="14" font-weight="600">
    <!-- Clé publique -->
    <g transform="translate(300 340)">
      <circle cx="0" cy="0" r="13" fill="none" stroke="#e8f4fc" stroke-width="4"/>
      <path d="M13 0 H62 M50 0 V10 M60 0 V8" stroke="#e8f4fc" stroke-width="4" stroke-linecap="round" fill="none"/>
      <text x="-18" y="34" fill="#e8f4fc">Clé publique</text>
    </g>
    <!-- Clé privée -->
    <g transform="translate(450 340)">
      <circle cx="0" cy="0" r="13" fill="none" stroke="#5eead4" stroke-width="4"/>
      <path d="M13 0 H62 M50 0 V10 M60 0 V8" stroke="#5eead4" stroke-width="4" stroke-linecap="round" fill="none"/>
      <text x="-12" y="34" fill="#5eead4">Clé privée</text>
    </g>
  </g>

  <!-- Quantique (à droite) : atome -->
  <g transform="translate(635 205)" fill="none" stroke="#5eead4" stroke-width="2.5">
    <ellipse rx="62" ry="22"/>
    <ellipse rx="62" ry="22" transform="rotate(60)"/>
    <ellipse rx="62" ry="22" transform="rotate(-60)"/>
    <circle r="8" fill="#5eead4" stroke="none"/>
  </g>
  <text x="635" y="292" text-anchor="middle" font-family="'Source Sans 3', system-ui, sans-serif" font-size="14" font-weight="600" fill="#5eead4">Quantique</text>
  <!-- Flèche quantique → cadenas, en pointillés (menace future) -->
  <path d="M565 205 H492" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 9" fill="none"/>
  <path d="M500 197 L490 205 L500 213" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="165" y="292" text-anchor="middle" font-family="'Source Sans 3', system-ui, sans-serif" font-size="14" font-weight="600" fill="#7aa7d9">Intelligence artificielle</text>
</svg>
