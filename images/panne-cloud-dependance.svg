<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d">
  <title id="t">Panne du cloud : quand tout dépend d'un seul fournisseur</title>
  <desc id="d">Illustration : un nuage central déconnecté, relié par des liens rompus à quatre outils de travail (courriel, messagerie d'équipe, agenda, documents partagés) et à un assistant IA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#1a3a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fond -->
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect width="800" height="420" fill="url(#grid)"/>
  <circle cx="400" cy="190" r="170" fill="url(#glow)"/>

  <!-- Liens rompus (pointillés coupés au milieu) -->
  <g stroke="#5eead4" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="6 7" fill="none" stroke-linecap="round">
    <path d="M150 105 L236 140"/>  <path d="M274 156 L320 170"/>
    <path d="M150 285 L236 252"/>  <path d="M274 238 L320 222"/>
    <path d="M650 105 L564 140"/>  <path d="M526 156 L480 170"/>
    <path d="M650 285 L564 252"/>  <path d="M526 238 L480 222"/>
    <path d="M400 340 L400 318"/>  <path d="M400 296 L400 268"/>
  </g>
  <!-- Marques de coupure -->
  <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
    <path d="M249 141 L261 155 M261 141 L249 155"/>
    <path d="M249 238 L261 252 M261 238 L249 252"/>
    <path d="M539 141 L551 155 M551 141 L539 155"/>
    <path d="M539 238 L551 252 M551 238 L539 252"/>
    <path d="M394 301 L406 313 M406 301 L394 313"/>
  </g>

  <!-- Nuage central -->
  <g transform="translate(400 195)">
    <path d="M-88 38 C-122 38 -128 -6 -96 -16 C-98 -54 -50 -70 -28 -44 C-14 -82 52 -80 58 -36 C96 -40 110 6 82 22 C92 38 80 38 70 38 Z"
          fill="#1a3a5c" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    <!-- Avertissement -->
    <path d="M0 -30 L30 22 H-30 Z" fill="#f59e0b" stroke="#f59e0b" stroke-width="5" stroke-linejoin="round"/>
    <path d="M0 -12 V6" stroke="#0d1b2a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="15" r="3.2" fill="#0d1b2a"/>
  </g>

  <!-- Courriel (haut gauche) -->
  <g transform="translate(118 92)">
    <rect x="-32" y="-22" width="64" height="44" rx="6" fill="#0d1b2a" stroke="#ffffff" stroke-width="3"/>
    <path d="M-30 -18 L0 4 L30 -18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- Messagerie d'équipe (haut droite) -->
  <g transform="translate(682 92)">
    <path d="M-32 -22 H32 A6 6 0 0 1 38 -16 V12 A6 6 0 0 1 32 18 H-6 L-20 30 V18 H-32 A6 6 0 0 1 -38 12 V-16 A6 6 0 0 1 -32 -22 Z" fill="#0d1b2a" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#ffffff"><circle cx="-14" cy="-2" r="3.5"/><circle cx="0" cy="-2" r="3.5"/><circle cx="14" cy="-2" r="3.5"/></g>
  </g>
  <!-- Agenda (bas gauche) -->
  <g transform="translate(118 298)">
    <rect x="-30" y="-26" width="60" height="54" rx="6" fill="#0d1b2a" stroke="#ffffff" stroke-width="3"/>
    <path d="M-30 -10 H30" stroke="#ffffff" stroke-width="3"/>
    <path d="M-14 -32 V-20 M14 -32 V-20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <g fill="#ffffff" fill-opacity="0.75"><rect x="-20" y="0" width="8" height="7" rx="1"/><rect x="-4" y="0" width="8" height="7" rx="1"/><rect x="12" y="0" width="8" height="7" rx="1"/><rect x="-20" y="13" width="8" height="7" rx="1"/><rect x="-4" y="13" width="8" height="7" rx="1"/></g>
  </g>
  <!-- Documents partagés (bas droite) -->
  <g transform="translate(682 298)">
    <path d="M-20 -32 H10 L26 -16 V30 H-20 Z" fill="#0d1b2a" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M10 -32 V-16 H26" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-10 -4 H16 M-10 6 H16 M-10 16 H8" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Assistant IA (bas centre) -->
  <g transform="translate(400 362)">
    <rect x="-24" y="-20" width="48" height="40" rx="10" fill="#0d1b2a" stroke="#ffffff" stroke-width="3"/>
    <path d="M-6 -14 L0 -2 L12 0 L0 2 L-6 14 L-12 2 L-24 0 L-12 -2 Z" transform="translate(6 0) scale(0.8)" fill="#5eead4"/>
  </g>

  <!-- Libellés -->
  <g font-family="'Source Sans 3', 'DejaVu Sans', system-ui, sans-serif" fill="#ffffff" fill-opacity="0.7" font-size="14" text-anchor="middle">
    <text x="118" y="138">Courriel</text>
    <text x="682" y="138">Messagerie</text>
    <text x="118" y="348">Agenda</text>
    <text x="682" y="348">Documents</text>
    <text x="440" y="367" text-anchor="start">Assistant IA</text>
  </g>
  <text x="400" y="52" text-anchor="middle" font-family="'Source Serif 4', 'DejaVu Serif', Georgia, serif" font-weight="700" font-size="22" fill="#ffffff">Quand le cloud tombe, tout s'arrête</text>
  <text x="400" y="78" text-anchor="middle" font-family="'Source Sans 3', 'DejaVu Sans', system-ui, sans-serif" font-size="15" fill="#f59e0b">Panne mondiale · 12 novembre 2026</text>
</svg>
